name: deploy-web

# Builds web/ as a static export and deploys it to Cloudflare Workers
# (https://nodogram.mdnodx.workers.dev). Repo secrets:
#   CLOUDFLARE_API_TOKEN  (token template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   NEXT_PUBLIC_TELEGRAM_API_ID, NEXT_PUBLIC_TELEGRAM_API_HASH
# Without CLOUDFLARE_API_TOKEN the build still runs but nothing is deployed.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_TELEGRAM_API_ID: ${{ secrets.NEXT_PUBLIC_TELEGRAM_API_ID }}
          NEXT_PUBLIC_TELEGRAM_API_HASH: ${{ secrets.NEXT_PUBLIC_TELEGRAM_API_HASH }}
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Skip notice
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; build checked but not deployed."
